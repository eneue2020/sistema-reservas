<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservar cita</title>
  <meta name="description" content="Reserva una cita online.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <main class="page">
    <article class="card" id="card" data-step="select">

      <!-- Panel izquierdo: profesional y servicio -->
      <aside class="host">
        <div class="host__avatar" id="host-avatar" aria-hidden="true"></div>
        <p class="host__name" id="host-name"></p>
        <h1 class="host__service" id="service-name"></h1>
        <ul class="host__meta">
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span id="service-duration"></span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>
            <span id="service-location"></span>
          </li>
          <li id="selection-summary" class="host__selection" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            <span id="selection-text"></span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
            <span id="host-timezone"></span>
          </li>
        </ul>
        <p class="host__description" id="service-description"></p>
      </aside>

      <!-- Paso 1: fecha y hora -->
      <section class="step step--select" id="step-select" aria-labelledby="select-title">
        <div class="calendar">
          <h2 class="step__title" id="select-title">Selecciona fecha y hora</h2>
          <div class="calendar__header">
            <span class="calendar__month" id="month-label" aria-live="polite"></span>
            <div class="calendar__nav">
              <button type="button" class="icon-btn" id="prev-month" aria-label="Mes anterior">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
              </button>
              <button type="button" class="icon-btn" id="next-month" aria-label="Mes siguiente">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
              </button>
            </div>
          </div>
          <div class="calendar__weekdays" aria-hidden="true">
            <span>lun</span><span>mar</span><span>mié</span><span>jue</span><span>vie</span><span>sáb</span><span>dom</span>
          </div>
          <div class="calendar__grid" id="calendar-grid"></div>

          <label class="timezone">
            <span class="timezone__label">Zona horaria</span>
            <select id="timezone-select"></select>
          </label>
        </div>

        <div class="slots" id="slots-panel">
          <p class="slots__date" id="slots-date"></p>
          <p class="notice" id="slots-notice" role="alert" hidden></p>
          <div class="slots__list" id="slots-list"></div>
        </div>
      </section>

      <!-- Paso 2: datos del cliente -->
      <section class="step step--form" id="step-form" hidden aria-labelledby="form-title">
        <button type="button" class="back-btn" id="back-button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
          Volver
        </button>
        <h2 class="step__title" id="form-title">Ingresa tus datos</h2>
        <form id="booking-form" class="form" novalidate>
          <label class="field">
            <span class="field__label">Nombre *</span>
            <input id="name-input" name="name" type="text" autocomplete="name" maxlength="100" required>
          </label>
          <label class="field">
            <span class="field__label">Email *</span>
            <input id="email-input" name="email" type="email" autocomplete="email" maxlength="254" required>
          </label>
          <p class="notice notice--error" id="form-error" role="alert" hidden></p>
          <button type="submit" class="btn btn--primary" id="submit-button">Confirmar reserva</button>
        </form>
      </section>

      <!-- Paso 3: confirmación -->
      <section class="step step--done" id="step-done" hidden aria-labelledby="done-title">
        <div class="done__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
        </div>
        <h2 class="done__title" id="done-title" tabindex="-1">Reserva confirmada</h2>
        <p class="done__message" id="done-message"></p>
        <dl class="done__details">
          <div><dt>Servicio</dt><dd id="done-service"></dd></div>
          <div><dt>Profesional</dt><dd id="done-professional"></dd></div>
          <div><dt>Fecha y hora</dt><dd id="done-datetime"></dd></div>
          <div><dt>Ubicación</dt><dd id="done-location"></dd></div>
        </dl>
        <div class="done__actions">
          <a class="btn btn--ghost" id="add-to-calendar" target="_blank" rel="noopener" hidden>Añadir a mi Google Calendar</a>
          <button type="button" class="btn btn--primary" id="new-booking">Hacer otra reserva</button>
        </div>
      </section>
    </article>
  </main>
</body>
</html>
